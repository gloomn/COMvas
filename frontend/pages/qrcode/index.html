<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMvas QRcode</title>
  <link rel="stylesheet" href="/frontend/styles/qrcode/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
  <!-- QRCode.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
  <div class="qr-station-container">
    <!-- Header -->
    <header class="station-header">
      <div class="logo">COMvas</div>
    </header>

    <!-- Main Content -->
    <main class="qr-main">
      <h1 class="headline">스마트폰 카메라로<br>QR 코드를 스캔하세요!</h1>
      <p class="subhead">그림을 완성하면 대형 무대에서 내 캐릭터가 춤추기 시작합니다.</p>

      <div class="qr-card">
        <div id="qrBox" class="qr-box"></div>
        <div class="url-display" id="urlDisplay">https://comvas.gloomn.site/draw</div>
      </div>
    </main>

    <!-- Footer Controls -->
    <footer class="station-footer">
      <button id="refreshBtn" class="refresh-btn">🔄 새 QR 코드 생성하기</button>
    </footer>
  </div>

  <script src="/frontend/scripts/qrcode/app.js"></script>
</body>

</html>
