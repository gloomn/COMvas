<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMvas QRcode</title>
  <link rel="stylesheet" href="/frontend/styles/qrcode/style.css?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/frontend/assets/logo.png">
  <!-- QRCode.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
  <div class="qr-station-container">
    <!-- Header -->
    <header class="station-header">
      <div class="logo" style="display:flex; align-items:center; gap:12px;"><img src="/frontend/assets/logo.png" alt="logo" style="width: 56px; height: 56px; border-radius: 12px;">COMvas</div>
    </header>

    <!-- Main Content -->
    <main class="qr-main">
      <h1 class="headline">스마트폰 카메라로<br>QR 코드를 스캔하세요</h1>
      <p class="subhead">
        그림을 완성하면 대형 무대에서 내 캐릭터가 춤추기 시작합니다.<br><br>
        <strong style="color: #a7f3d0; background: rgba(16, 185, 129, 0.2); padding: 4px 10px; border-radius: 20px;">[안내] 한 명씩 차례대로 스캔해주세요</strong>
      </p>

      <div class="qr-card">
        <div id="qrBox" class="qr-box"></div>
        <div class="url-display" id="urlDisplay">https://comvas.gloomn.site/draw</div>
      </div>
    </main>

    <!-- No footer controls, moved to Admin Panel -->
    
    <!-- Loading Overlay -->
    <div id="qrLoadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.85); z-index:100; flex-direction:column; justify-content:center; align-items:center;">
      <div style="border: 4px solid #e2e8f0; border-top: 4px solid #a855f7; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;"></div>
      <p style="color:#1e293b; font-size:1.2rem; font-weight:800; margin-top:20px;">새로운 QR코드 생성 중...</p>
      <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <script src="/frontend/scripts/qrcode/app.js?v=5"></script>
</body>

</html>
