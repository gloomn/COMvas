<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMvas Viewer</title>
  <link rel="stylesheet" href="/frontend/styles/viewer/viewer.css?v=9">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Pretendard:wght@600;800&display=swap"
    rel="stylesheet">
  <!-- Pixi.js v7 WebGL Hardware Acceleration Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
  <!-- QRCode.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
  <!-- Real Lighting Effects -->
  <div class="stage-lights-container">
    <div class="spotlight spotlight-left"></div>
    <div class="spotlight spotlight-right"></div>
    <div class="spotlight spotlight-center"></div>
  </div>

  <div id="stageContainer" class="stage-container">
    <!-- WebGL Canvas will be injected here by Pixi.js -->
  </div>

  <!-- HUD Top Bar -->
  <div class="hud-overlay">
    <!-- Removed stats counter as requested -->
  </div>

  <!-- COMvas Neon Arch Sign & Credit -->
  <div class="stage-neon-sign"
    style="position: absolute; top: 5%; left: 50%; transform: translateX(-50%); width: 800px; height: 400px; z-index: 100; pointer-events: none;">
    <svg viewBox="0 0 800 400" width="100%" height="100%">
      <!-- Main COMvas Arch -->
      <path id="archPath" d="M 50,300 A 350,200 0 0,1 750,300" fill="transparent" />
      <text width="800" fill="#fff" font-family="'Outfit', sans-serif" font-size="110px" font-weight="900"
        class="neon-text-animated">
        <textPath href="#archPath" startOffset="50%" text-anchor="middle" dominant-baseline="middle">
          COMvas
        </textPath>
      </text>

      <!-- Credit Sub-Arch -->
      <path id="subArchPath" d="M 50,370 A 350,200 0 0,1 750,370" fill="transparent" />
      <text width="800" font-family="'Outfit', sans-serif" font-size="22px" font-weight="800"
        class="developer-credit-text">
        <textPath href="#subArchPath" startOffset="50%" text-anchor="middle" dominant-baseline="middle">
          <tspan fill="#00ffff" class="glow-cyan">Computer Education</tspan>
          <tspan fill="#ffffff"> | </tspan>
          <tspan fill="#ff7a00" class="glow-orange">Semicolon(;)</tspan>
        </textPath>
      </text>
    </svg>
  </div>
  
  <!-- Copyright Neon Sign -->
  <div style="position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; overflow: visible;">
    <span style="font-family: 'Outfit', 'Pretendard', sans-serif; font-size: 15px; font-weight: 800; color: #fff; text-shadow: 0 0 2px #ff00a0, 0 0 5px #ff00a0, 0 0 8px #ff00a0; letter-spacing: 2px;">
      © leekijoon
    </span>
  </div>

  <script src="/frontend/scripts/viewer/stage.js?v=5"></script>
  <script src="/frontend/scripts/viewer/character.js?v=15"></script>
  <script src="/frontend/scripts/viewer/queue.js?v=3"></script>
  <script src="/frontend/scripts/viewer/websocket.js?v=4"></script>
</body>

</html>
