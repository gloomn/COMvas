<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMvas - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/frontend/assets/logo.png">
  <style>
    :root { 
      --bg: #0a0a0f;
      --surface: rgba(255, 255, 255, 0.03);
      --primary: #a855f7; 
      --primary-glow: rgba(168, 85, 247, 0.4);
      --text: #f8fafc; 
      --text-dim: #94a3b8; 
      --glass-border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      font-family: 'Pretendard', sans-serif; 
      margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; 
    }
    
    header { 
      background: transparent;
      padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; 
      z-index: 10; 
    }
    
    h1 { 
      margin: 0; font-size: 1.8rem; font-weight: 900; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #a855f7, #60a5fa); -webkit-background-clip: text; color: transparent; 
    }
    
    .btn { 
      background: rgba(255,255,255,0.05); color: white; border: var(--glass-border); 
      padding: 10px 20px; border-radius: 12px; cursor: pointer; text-decoration: none; 
      font-weight: bold; font-size: 0.95rem; transition: all 0.3s ease; 
      backdrop-filter: blur(10px);
    }
    .btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    
    .btn-primary { 
      background: linear-gradient(135deg, #a855f7, #6366f1); border: none; 
    }
    .btn-primary:hover { 
      background: linear-gradient(135deg, #9333ea, #4f46e5); box-shadow: 0 5px 20px var(--primary-glow); 
    }
    
    .container { display: flex; flex: 1; overflow: hidden; }
    .main-content { flex: 1; padding: 40px; overflow-y: auto; }
    
    /* Stats Glass Pills */
    .stats { 
      display: flex; flex-direction: column; gap: 15px; margin: 25px; margin-bottom: 0;
    }
    .stat-box { 
      background: rgba(255, 255, 255, 0.02); border: var(--glass-border); 
      padding: 15px 25px; border-radius: 16px; font-size: 1.1rem; font-weight: 600; 
      display: flex; align-items: center; gap: 15px; 
    }
    .stat-box span { font-size: 2rem; font-weight: 900; }
    
    /* Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; }
    .card { 
      background: var(--surface); border-radius: 24px; padding: 25px; text-align: center; 
      border: var(--glass-border); backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
      display: flex; flex-direction: column;
    }
    .card:hover { 
      transform: translateY(-12px) scale(1.02); border-color: rgba(168, 85, 247, 0.4); 
      box-shadow: 0 20px 40px rgba(168, 85, 247, 0.2); 
    }
    .card img { 
      width: 100%; height: 180px; object-fit: contain; background: rgba(0,0,0,0.5); 
      border-radius: 16px; margin-bottom: 20px; border: var(--glass-border); 
    }
    .card .type { font-size: 1rem; color: #60a5fa; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
    .card .id { font-size: 0.8rem; color: var(--text-dim); word-break: break-all; margin-bottom: 25px; font-family: 'JetBrains Mono', monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; }
    .delete-btn { 
      background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); 
      padding: 12px; border-radius: 12px; width: 100%; cursor: pointer; font-weight: 800; font-size: 0.95rem; transition: all 0.3s; margin-top: auto;
    }
    .delete-btn:hover { background: #ef4444; color: white; box-shadow: 0 0 20px rgba(239,68,68,0.5); transform: translateY(-2px); }
    
    /* Sidebar (Logs) */
    .sidebar { 
      width: 450px; display: flex; flex-direction: column; z-index: 5; 
      border-left: var(--glass-border);
    }
    .sidebar-header { 
      padding: 25px; border-bottom: var(--glass-border); color: #34d399; 
      font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 900; 
      display: flex; justify-content: space-between; align-items: center; letter-spacing: 1px; text-transform: uppercase; 
    }
    #clearLogBtn {
      background: rgba(255,255,255,0.05); border: var(--glass-border); color: #94a3b8; 
      padding: 8px 16px; border-radius: 8px; transition: 0.3s; cursor: pointer; font-weight: bold; font-size: 0.85rem;
    }
    #clearLogBtn:hover { background: rgba(255,255,255,0.1); color: white; }
    
    .log-container { 
      flex: 1; padding: 25px; overflow-y: auto; font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; 
      font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; 
      background-color: #050505; border: 1px solid #1f2937; border-radius: 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .log-item { 
      color: #34d399; word-break: break-all; line-height: 1.4; display: flex; gap: 10px; 
      padding: 4px 8px; border-radius: 4px;
      transition: background 0.2s;
    }
    .log-item:hover { background: rgba(52, 211, 153, 0.1); }
    .log-time { color: #6b7280; min-width: 70px; user-select: none; font-weight: normal; }
    .log-new { color: #a855f7; }
    .log-delete { color: #ef4444; }
    .log-server { color: #60a5fa; }
    
    .log-container::-webkit-scrollbar { width: 8px; }
    .log-container::-webkit-scrollbar-thumb { background: rgba(52, 211, 153, 0.2); border-radius: 4px; }
    
    @media (max-width: 768px) {
      body { height: auto; overflow: visible; }
      header { flex-direction: column; gap: 15px; text-align: center; }
      header div { flex-wrap: wrap; justify-content: center; }
      .container { flex-direction: column; height: auto; overflow: visible; }
      .main-content { padding: 15px; overflow: visible; }
      .stats { flex-direction: column; gap: 15px; margin-bottom: 15px; }
      .sidebar { width: 100%; height: 500px; border-left: none; border-top: var(--glass-border); box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
    }

    /* Password Overlay Styles */
    #passwordOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, rgba(16,18,27,0.8) 0%, rgba(5,6,10,0.95) 100%);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; color: white; font-family: 'Pretendard', sans-serif;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border-radius: 24px;
      padding: 50px 40px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .login-box h2 {
      margin: 0; font-size: 2.2rem; font-weight: 900;
      background: linear-gradient(135deg, #a855f7, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .login-box p {
      margin: 0; color: #94a3b8; font-size: 0.95rem;
    }
    #passwordOverlay input {
      padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
      background: rgba(0,0,0,0.3); color: white; font-size: 1.1rem; text-align: center;
      transition: all 0.3s ease; outline: none; letter-spacing: 2px;
    }
    #passwordOverlay input:focus {
      border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); background: rgba(0,0,0,0.5);
    }
    #passwordOverlay button {
      padding: 16px; border-radius: 12px; border: none; 
      background: linear-gradient(135deg, #a855f7, #6366f1); 
      color: white; font-weight: 800; font-size: 1.1rem; cursor: pointer;
      transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }
    #passwordOverlay button:hover {
      transform: translateY(-2px); box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6);
    }
    #passwordOverlay button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <!-- Password Lock Overlay -->
  <div id="passwordOverlay">
    <div class="login-box">
      <h2 style="display:flex; justify-content:center; align-items:center; gap:10px;"><img src="/frontend/assets/logo.png" alt="logo" style="width: 32px; height: 32px; border-radius: 8px;">COMvas Admin</h2>
      <p>시스템에 안전하게 로그인하세요.</p>
      <input type="password" id="adminPassword" placeholder="비밀번호 입력">
      <button id="unlockBtn">시스템 접속</button>
    </div>
  </div>

  <header>
    <h1 style="display:flex; align-items:center; gap:10px;"><img src="/frontend/assets/logo.png" alt="logo" style="width: 28px; height: 28px; border-radius: 6px;">COMvas Admin</h1>
    <div style="display: flex; gap: 12px;">
      <a href="/viewer" target="_blank" class="btn" style="display: flex; align-items: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        무대 뷰어
      </a>
      <a href="/qrcode" target="_blank" class="btn" style="display: flex; align-items: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
        스캐너
      </a>
      <a href="/keepdraw" target="_blank" class="btn" style="display: flex; align-items: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-6M6 20V10M18 20V4"></path></svg>
        무제한 패드
      </a>
      <button class="btn btn-primary" id="refreshQrBtn" style="display: flex; align-items: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        QR 갱신
      </button>
    </div>
  </header>
  
  <div class="tabs-container" style="padding: 0 40px 20px 40px; border-bottom: var(--glass-border); display: flex; gap: 15px;">
    <button class="tab-btn active" id="tabDashboard" style="background: rgba(255,255,255,0.1); color: white; border: var(--glass-border); padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s;">대시보드 (Queue & Logs)</button>
    <button class="tab-btn" id="tabObjects" style="background: transparent; color: var(--text-dim); border: 1px solid transparent; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s;">무대 객체 관리 (Objects)</button>
  </div>
  
  <div class="container" style="flex-direction: column;">
    
    <!-- DASHBOARD VIEW -->
    <div id="viewDashboard" style="display: flex; width: 100%; flex: 1; overflow: hidden;">
      <!-- Left side: Stats & Queue -->
      <div style="flex: 1; padding: 30px; display: flex; flex-direction: column; gap: 30px; border-right: var(--glass-border); overflow-y: auto;">
        
        <div class="stats" style="flex-direction: row; margin: 0; justify-content: flex-start;">
          <div class="stat-box" style="display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            캐릭터: <span id="charCount" style="color: var(--primary); font-size: 1.8rem;">0</span>
          </div>
          <div class="stat-box" style="display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #3b82f6;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
            무대 소품: <span id="staticCount" style="color: #3b82f6; font-size: 1.8rem;">0</span>
          </div>
        </div>

        <div style="background: var(--surface); border: var(--glass-border); border-radius: 16px; padding: 25px; flex: 1; display: flex; flex-direction: column;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; color: #f8fafc;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            Active Task & Queue
          </div>
          <div id="adminQueueContainer" style="display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1; padding-right: 10px;">
            <div style="color: var(--text-dim); font-size: 0.95rem; text-align: center; margin-top: 20px;">현재 진행 중인 작업이 없습니다.</div>
          </div>
        </div>
      </div>
      
      <!-- Right side: Logs -->
      <div style="flex: 1; display: flex; flex-direction: column;">
        <div class="sidebar-header" style="border-top: none;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
            System Logs
          </span>
          <button id="clearLogBtn" style="background:rgba(255,255,255,0.05); border:var(--glass-border); color:#94a3b8; cursor:pointer; font-weight:bold; font-size:0.85rem; padding:8px 16px; border-radius:8px; transition: 0.3s;">Clear Logs</button>
        </div>
        <div class="log-container" id="logContainer" style="flex: 1; padding: 25px; overflow-y: auto;">
          <!-- Logs will appear here -->
        </div>
      </div>
    </div>

    <!-- OBJECTS VIEW -->
    <div id="viewObjects" style="display: none; width: 100%; flex: 1; padding: 40px; overflow-y: auto;">
      <div class="grid" id="objectsGrid">
        <div style="color: var(--text-dim); font-size: 1.2rem; padding: 40px; text-align: center; grid-column: 1 / -1;">무대 데이터를 불러오는 중입니다...</div>
      </div>
    </div>
    
  </div>

  <script src="/frontend/scripts/admin/app.js?v=9"></script>
</body>
</html>
