<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMvas - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0f111a; --surface: #1e1e28; --primary: #a855f7; --text: #f1f5f9; --text-dim: #94a3b8; }
    body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--surface); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 10; }
    h1 { margin: 0; font-size: 1.5rem; background: linear-gradient(90deg, #a855f7, #ec4899); -webkit-background-clip: text; color: transparent; }
    .btn { background: #333; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
    .btn:hover { background: #444; }
    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: #9333ea; }
    
    .container { display: flex; flex: 1; overflow: hidden; }
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    .stats { display: flex; gap: 30px; margin-bottom: 30px; background: var(--surface); padding: 20px 30px; border-radius: 16px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .stat-box { font-size: 1.2rem; font-weight: 600; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
    .card { background: var(--surface); border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #333; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 10px 25px rgba(168, 85, 247, 0.2); }
    .card img { width: 100%; height: 160px; object-fit: contain; background: #000; border-radius: 12px; margin-bottom: 15px; border: 1px solid #222; }
    .card .type { font-size: 0.9rem; color: var(--primary); font-weight: 800; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .card .id { font-size: 0.75rem; color: #666; word-break: break-all; margin-bottom: 20px; font-family: monospace; }
    .delete-btn { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
    .delete-btn:hover { background: #dc2626; box-shadow: 0 0 15px rgba(239,68,68,0.4); }
    
    .sidebar { width: 400px; background: #0a0a0f; border-left: 1px solid #1f2937; display: flex; flex-direction: column; z-index: 5; }
    .sidebar-header { padding: 15px 20px; border-bottom: 1px solid #1f2937; color: #10b981; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; letter-spacing: 1px; text-transform: uppercase; }
    .log-container { flex: 1; padding: 15px; overflow-y: auto; background: #000; font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 0.8rem; display: flex; flex-direction: column; gap: 4px; }
    .log-item { color: #d1d5db; word-break: break-all; line-height: 1.4; display: flex; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
    .log-time { color: #6b7280; min-width: 65px; user-select: none; }
    .log-new { color: #34d399; }
    .log-delete { color: #f87171; }
    .log-server { color: #60a5fa; }
    .log-container::-webkit-scrollbar { width: 6px; }
    .log-container::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    
    @media (max-width: 768px) {
      body { height: auto; overflow: visible; }
      header { flex-direction: column; gap: 15px; text-align: center; }
      header div { flex-wrap: wrap; justify-content: center; }
      .container { flex-direction: column; height: auto; overflow: visible; }
      .main-content { padding: 15px; overflow: visible; }
      .stats { flex-direction: column; gap: 15px; padding: 15px; margin-bottom: 15px; }
      .sidebar { width: 100%; height: 400px; border-left: none; border-top: 1px solid #1f2937; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); }
    }

    /* Password Overlay Styles */
    #passwordOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, rgba(16,18,27,0.8) 0%, rgba(5,6,10,0.95) 100%);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; color: white; font-family: 'Pretendard', sans-serif;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border-radius: 24px;
      padding: 50px 40px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .login-box h2 {
      margin: 0; font-size: 2.2rem; font-weight: 900;
      background: linear-gradient(135deg, #a855f7, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .login-box p {
      margin: 0; color: #94a3b8; font-size: 0.95rem;
    }
    #passwordOverlay input {
      padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
      background: rgba(0,0,0,0.3); color: white; font-size: 1.1rem; text-align: center;
      transition: all 0.3s ease; outline: none; letter-spacing: 2px;
    }
    #passwordOverlay input:focus {
      border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); background: rgba(0,0,0,0.5);
    }
    #passwordOverlay button {
      padding: 16px; border-radius: 12px; border: none; 
      background: linear-gradient(135deg, #a855f7, #6366f1); 
      color: white; font-weight: 800; font-size: 1.1rem; cursor: pointer;
      transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }
    #passwordOverlay button:hover {
      transform: translateY(-2px); box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6);
    }
    #passwordOverlay button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <!-- Password Lock Overlay -->
  <div id="passwordOverlay">
    <div class="login-box">
      <h2>COMvas Admin</h2>
      <p>시스템에 안전하게 로그인하세요.</p>
      <input type="password" id="adminPassword" placeholder="비밀번호 입력">
      <button id="unlockBtn">시스템 접속</button>
    </div>
  </div>

  <header>
    <h1>COMvas Admin Center</h1>
    <div style="display: flex; gap: 12px;">
      <a href="/viewer" target="_blank" class="btn" style="display: flex; align-items: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        무대 뷰어
      </a>
      <a href="/qrcode" target="_blank" class="btn" style="display: flex; align-items: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
        스캐너
      </a>
      <a href="/keepdraw" target="_blank" class="btn" style="display: flex; align-items: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-6M6 20V10M18 20V4"></path></svg>
        무제한 패드
      </a>
      <button class="btn btn-primary" id="refreshQrBtn" style="display: flex; align-items: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        QR 갱신
      </button>
      <button class="btn btn-primary" id="refreshBtn" style="display: flex; align-items: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
        데이터 동기화
      </button>
    </div>
  </header>
  
  <div class="container">
    <div class="main-content">
      <div class="stats">
        <div class="stat-box" style="display: flex; align-items: center; gap: 8px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          캐릭터: <span id="charCount" style="color: var(--primary); font-size: 1.5rem;">0</span>
        </div>
        <div class="stat-box" style="display: flex; align-items: center; gap: 8px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #3b82f6;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
          무대 소품: <span id="staticCount" style="color: #3b82f6; font-size: 1.5rem;">0</span>
        </div>
      </div>
      
      <div class="grid" id="objectsGrid">
        <div style="color: var(--text-dim); font-size: 1.2rem; padding: 40px; text-align: center; grid-column: 1 / -1;">무대 데이터를 불러오는 중입니다...</div>
      </div>
    </div>
    
    <div class="sidebar">
      <div class="sidebar-header">
        <span style="display: flex; align-items: center; gap: 8px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
          System Logs
        </span>
        <button id="clearLogBtn" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-weight:bold; font-size:0.8rem; padding:5px 10px; border-radius:4px;">Clear</button>
      </div>
      <div class="log-container" id="logContainer">
        <!-- Logs will appear here -->
      </div>
    </div>
  </div>

  <script src="/frontend/scripts/admin/app.js?v=5"></script>
</body>
</html>
