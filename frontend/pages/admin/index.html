<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMvas - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0a0b10;
      color: #fff;
      font-family: 'Pretendard', sans-serif;
      margin: 0; padding: 20px;
    }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.5rem; color: #a855f7; }
    .refresh-btn { background: #333; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .card { background: #1e1e24; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #333; }
    .card img { max-width: 100%; height: 120px; object-fit: contain; background: #000; border-radius: 8px; margin-bottom: 10px; }
    .card .type { font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; }
    .card .id { font-size: 0.7rem; color: #555; word-break: break-all; margin-bottom: 10px; }
    .delete-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
    .delete-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <header>
    <h1>COMvas Stage Admin</h1>
    <div style="display: flex; gap: 15px; align-items: center;">
      <a href="/viewer" target="_blank" style="color: #a7f3d0; text-decoration: none; font-weight: bold;">🖥️ 뷰어 띄우기</a>
      <a href="/qrcode" target="_blank" style="color: #93c5fd; text-decoration: none; font-weight: bold;">📱 QR코드 띄우기</a>
      <a href="/keepdraw" target="_blank" style="color: #fca5a5; text-decoration: none; font-weight: bold;">♾️ 무제한모드 띄우기</a>
      <button class="refresh-btn" id="refreshBtn">새로고침</button>
    </div>
  </header>
  
  <div style="margin-bottom: 20px; font-size: 1.1rem; color: #cbd5e1; display: flex; gap: 20px;">
    <div>정적 모형(소품): <span id="staticCount" style="color: #a855f7; font-weight: bold;">0</span>개</div>
    <div>사람 모형(캐릭터): <span id="charCount" style="color: #3b82f6; font-weight: bold;">0</span>개</div>
  </div>
  
  <div class="grid" id="objectsGrid">
    <div style="color: #666;">로딩 중...</div>
  </div>

  <script src="/frontend/scripts/admin/app.js?v=1"></script>
</body>
</html>
