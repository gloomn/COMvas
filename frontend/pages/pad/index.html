<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COMvas - Drawing Pad</title>
  <link rel="stylesheet" href="/frontend/styles/pad/style.css?v=6">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/frontend/assets/logo.png">
</head>

<body>
  <!-- Full Screen Loading Overlay -->
  <div id="fullScreenLoading" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
    <svg style="margin-bottom: 20px; animation: spin 1s linear infinite; color: #a855f7;" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
    <div id="loadingMessage" style="color: white; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px;">처리 중...</div>
    
    <div id="progressContainer" class="hidden" style="width: 80%; max-width: 300px; text-align: center;">
      <div style="font-size: 0.95rem; color: #e9d5ff; margin-bottom: 8px; font-weight: 700;" id="progressText">대기열 진입 중...</div>
      <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; position: relative;">
        <div id="progressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #a855f7, #ec4899); transition: width 0.3s ease;"></div>
      </div>
    </div>
    <style>
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo"><img src="/frontend/assets/logo.png" alt="logo" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 8px; border-radius: 6px;">COMvas</div>
      <div class="token-badge" id="tokenBadge">토큰 검증 중...</div>
    </header>

    <!-- Error Banner -->
    <div id="errorBanner" class="error-banner hidden">
      유효하지 않거나 이미 사용된 QR 코드입니다. 부스에서 새로운 QR 코드를 받으세요!
    </div>

    <!-- Drawing Mode Tabs -->
    <div id="drawingTabs" style="display: flex; justify-content: center; gap: 10px; padding: 10px 16px;">
      <button id="tabPerson" class="btn btn-primary" style="flex: 1; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path><path d="M5 12h14"></path><path d="M12 12v6"></path><path d="M9 22l3 -4l3 4"></path></svg>
        댄서 그리기
      </button>
      <button id="tabStatic" class="btn btn-secondary" style="flex: 1; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
        소품 꾸미기
      </button>
    </div>

    <!-- Drawing Canvas Section -->
    <main class="canvas-wrapper" style="position: relative;">
      <div class="canvas-card" style="position: relative;">
        <!-- Transparent Vitruvian Da-ja Silhouette Overlay Canvas -->
        <canvas id="guideCanvas" width="512" height="512" class="guide-canvas"></canvas>
        <!-- Main User Drawing Canvas -->
        <canvas id="drawCanvas" width="512" height="512" class="draw-canvas"></canvas>
        <!-- Interactive Skeleton Layer (Hidden initially) -->
        <div id="skeletonLayer" class="skeleton-layer hidden"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none;">
          <!-- Draggable joint dots will be injected here via JS -->
        </div>
      </div>

      <div class="guide-tip" id="guideTip" style="display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #fbbf24;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        <span><b>팁:</b> 화면의 <b>'대자' 실루엣 가이드라인</b>에 맞춰 인물의 머리, 팔, 다리를 그려주세요!</span>
      </div>

    <!-- Removed progress container from here -->
    </main>

    <!-- Toolbar Controls -->
    <footer class="controls" id="drawingControls">
      <div class="color-palette">
        <button class="color-btn active" style="background-color: #000000;" data-color="#000000"></button>
        <button class="color-btn" style="background-color: #ff3b30;" data-color="#ff3b30"></button>
        <button class="color-btn" style="background-color: #007aff;" data-color="#007aff"></button>

        <!-- Custom Color Picker -->
        <div class="color-picker-wrapper">
          <input type="color" id="customColor" class="custom-color-input" value="#ff00ff">
        </div>

        <!-- Neon Toggle -->
        <button class="color-btn neon-toggle-btn" id="neonToggleBtn" title="네온 브러시 효과 켜기/끄기"
          style="background: linear-gradient(45deg, #a855f7, #ec4899); color: white; display:flex; justify-content:center; align-items:center;">✨</button>

        <!-- Eraser -->
        <button class="color-btn eraser-btn" id="eraserBtn" title="지우개" style="display:flex; justify-content:center; align-items:center;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20H20"/></svg>
        </button>

        <!-- Upload Image -->
        <button class="color-btn upload-btn" id="uploadBtn" title="사진 업로드"
          style="background: #e2e8f0; border-radius: 50%; font-size: 1.2rem; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; color: #475569;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <input type="file" id="uploadInput" accept="image/*" style="position: absolute; left: -9999px; opacity: 0;">
      </div>

      <div class="brush-tools">
        <button id="undoBtn" class="btn btn-secondary" style="padding: 8px; display:flex; justify-content:center; align-items:center;" title="이전으로 가기">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>
        <button id="redoBtn" class="btn btn-secondary" style="padding: 8px; display:flex; justify-content:center; align-items:center;" title="다음으로 가기">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
        </button>
        <button id="clearBtn" class="btn btn-secondary" style="padding: 8px; display:flex; justify-content:center; align-items:center; gap: 6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          지우기
        </button>
        <button id="nextBtn" class="btn btn-primary" style="display:flex; justify-content:center; align-items:center;" title="뼈대 맞추기">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </footer>

    <!-- Joint Adjust Controls (Hidden initially) -->
    <footer class="controls hidden" id="jointControls">
      <div style="width: 100%; margin-bottom: 12px;">
        <label for="motionSelect"
          style="font-size: 0.85rem; color: #555; font-weight: 600; display: block; margin-bottom: 6px;">🎬 어떤 모션으로
          춤출까요?</label>
        <select id="motionSelect"
          style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; font-size: 0.95rem; background: #fff; color: #333; outline: none; cursor: pointer;">
          <option value="random">🎲 아무거나 랜덤 (Random)</option>
          <option value="jumping">🏃‍♂️ 달리기 (Running Jump)</option>
          <option value="jumping_jacks">🤸 점핑잭 (Jumping Jacks)</option>
          <option value="dab">😎 댑 댄스 (Dab Dance)</option>
          <option value="jesse_dance">🕺 제시 댄스 (Jesse Dance)</option>
          <option value="wave_hello">👋 인사하기 (Wave Hello)</option>
          <option value="zombie">🧟 좀비 워킹 (Zombie Walk)</option>
          <option value="breakdance_freeze">🥶 비보이 프리즈 (B-boy Freeze)</option>
          <option value="flair">🌪️ 플레어 (Flair)</option>
          <option value="hiphopdancing">🧢 힙합 댄스 (Hip Hop)</option>
          <option value="gangnamstyle">🕺 강남스타일 (Gangnam Style)</option>
        </select>
      </div>
      <div class="brush-tools" style="width: 100%; justify-content: space-between; align-items: center;">
        <button id="backBtn" class="btn btn-secondary" style="padding: 8px 12px; font-size: 0.9rem; display:flex; justify-content:center; align-items:center; gap:6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          다시 그리기
        </button>
        <div style="font-size: 0.8rem; color: #777; text-align: center; line-height: 1.2;">점을 드래그하여<br>관절에 맞추세요</div>
        <button id="submitBtn" class="btn btn-primary" style="padding: 8px 12px; font-size: 0.9rem; display:flex; justify-content:center; align-items:center; gap:6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>
          무대에 전송하기
        </button>
      </div>
    </footer>
  </div>

  <script src="/frontend/scripts/pad/silhouette.js?v=3"></script>
  <script src="/frontend/scripts/pad/canvas.js?v=6"></script>
  <script src="/frontend/scripts/pad/skeleton_ui.js?v=4"></script>
  <script src="/frontend/scripts/pad/app.js?v=12"></script>
</body>

</html>
