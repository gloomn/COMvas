<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMvas Viewer</title>
  <link rel="stylesheet" href="/frontend/viewer/css/viewer.css?v=7">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Pretendard:wght@600;800&display=swap"
    rel="stylesheet">
  <!-- Pixi.js v7 WebGL Hardware Acceleration Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
  <!-- QRCode.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
  <div id="stageContainer" class="stage-container">
    <!-- WebGL Canvas will be injected here by Pixi.js -->
  </div>

  <!-- HUD Top Bar -->
  <div class="hud-overlay">
    <!-- Removed stats counter as requested -->
  </div>

  <!-- COMvas Neon Arch Sign & Credit -->
  <div class="stage-neon-sign"
    style="position: absolute; top: 5%; left: 50%; transform: translateX(-50%); width: 800px; height: 400px; z-index: 100; pointer-events: none;">
    <svg viewBox="0 0 800 400" width="100%" height="100%">
      <!-- Main COMvas Arch -->
      <path id="archPath" d="M 50,300 A 350,200 0 0,1 750,300" fill="transparent" />
      <text width="800" fill="#fff" font-family="'Outfit', sans-serif" font-size="110px" font-weight="900"
        class="neon-text-animated">
        <textPath href="#archPath" startOffset="50%" text-anchor="middle" dominant-baseline="middle">
          COMvas
        </textPath>
      </text>

      <!-- Credit Sub-Arch -->
      <path id="subArchPath" d="M 150,340 A 250,150 0 0,1 650,340" fill="transparent" />
      <text width="800" fill="#fff" font-family="'Outfit', sans-serif" font-size="22px" font-weight="800"
        class="developer-credit-text">
        <textPath href="#subArchPath" startOffset="50%" text-anchor="middle" dominant-baseline="middle">
          Semicolon(;) | Lee Ki Joon
        </textPath>
      </text>
    </svg>
  </div>
  <script src="/frontend/viewer/js/stage.js?v=5"></script>
  <script src="/frontend/viewer/js/character.js?v=14"></script>
  <script src="/frontend/viewer/js/queue.js?v=3"></script>
  <script src="/frontend/viewer/js/websocket.js?v=3"></script>
</body>

</html>
