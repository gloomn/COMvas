<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMvas Viewer</title>
  <link rel="stylesheet" href="/frontend/viewer/css/viewer.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&family=Pretendard:wght@600;800&display=swap"
    rel="stylesheet">
  <!-- Pixi.js v7 WebGL Hardware Acceleration Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
  <!-- QRCode.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
  <div id="stageContainer" class="stage-container">
    <!-- WebGL Canvas will be injected here by Pixi.js -->
  </div>

  <!-- HUD Top Bar -->
  <div class="hud-overlay">
    <div class="brand-badge">
      COMvas
    </div>
    <div class="stats-counter" id="statsCounter">
      무대 연동 캐릭터: <span id="charCount">0</span> / 15명
    </div>
  </div>
  <!-- Developer Credit Footer -->
  <div class="developer-credit">
    Semicolon(;) | Lee Ki Joon
  </div>
  <script src="/frontend/viewer/js/stage.js?v=2"></script>
  <script src="/frontend/viewer/js/character.js?v=12"></script>
  <script src="/frontend/viewer/js/queue.js"></script>
  <script src="/frontend/viewer/js/websocket.js"></script>
</body>

</html>
