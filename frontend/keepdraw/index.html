<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COMvas - Unlimited Pad</title>
  <link rel="stylesheet" href="/frontend/pad/css/style.css?v=4">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* Password Overlay Styles */
    #passwordOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 11, 16, 0.95); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; color: white;
    }
    #passwordOverlay input {
      padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 1.1rem; text-align: center;
    }
    #passwordOverlay button {
      padding: 12px 24px; border-radius: 8px; border: none; background: #a855f7; color: white; font-weight: bold; cursor: pointer;
    }
  </style>
</head>

<body>
  <!-- Password Lock Overlay -->
  <div id="passwordOverlay">
    <h2 style="margin-bottom: 8px;">COMvas 관리자 무제한 패드</h2>
    <p style="color: #94a3b8; margin-bottom: 20px;">무제한 생성을 위한 비밀번호를 입력하세요.</p>
    <input type="password" id="adminPassword" placeholder="비밀번호 입력">
    <button id="unlockBtn">잠금 해제</button>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">COMvas <span style="font-size: 0.8rem; color: #a855f7;">(Unlimited)</span></div>
      <div class="token-badge valid" id="tokenBadge" style="background: rgba(34, 197, 94, 0.2); color: #22c55e;">무제한 모드</div>
    </header>

    <!-- Drawing Mode Tabs -->
    <div id="drawingTabs" style="display: flex; justify-content: center; gap: 10px; padding: 10px 16px;">
      <button id="tabPerson" class="btn btn-primary" style="flex: 1; border-radius: 20px; font-size: 0.9rem;">🕺 댄서 그리기</button>
      <button id="tabStatic" class="btn btn-secondary" style="flex: 1; border-radius: 20px; font-size: 0.9rem;">⭐ 소품 꾸미기</button>
    </div>

    <!-- Drawing Canvas Section -->
    <main class="canvas-wrapper" style="position: relative;">
      <div class="canvas-card" style="position: relative;">
        <!-- Transparent Vitruvian Da-ja Silhouette Overlay Canvas -->
        <canvas id="guideCanvas" width="512" height="512" class="guide-canvas"></canvas>
        <!-- Main User Drawing Canvas -->
        <canvas id="drawCanvas" width="512" height="512" class="draw-canvas"></canvas>
        <!-- Interactive Skeleton Layer (Hidden initially) -->
        <div id="skeletonLayer" class="skeleton-layer hidden"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none;">
          <!-- Draggable joint dots will be injected here via JS -->
        </div>
      </div>

      <div class="guide-tip" id="guideTip">
        <span>💡 <b>팁:</b> 화면의 <b>'대자' 실루엣 가이드라인</b>에 맞춰 인물의 머리, 팔, 다리를 그려주세요!</span>
      </div>

      <!-- Real-time Loading Bar -->
      <div id="progressContainer" class="hidden" style="margin-top: 20px; width: 100%; text-align: center;">
        <div style="font-size: 0.85rem; color: #a855f7; margin-bottom: 8px; font-weight: 700;" id="progressText">대기열 진입 중... (0%)</div>
        <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;">
          <div id="progressBar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #a855f7, #6366f1); transition: width 0.3s ease;"></div>
        </div>
      </div>
    </main>

    <!-- Toolbar Controls -->
    <footer class="controls" id="drawingControls">
      <div class="color-palette">
        <button class="color-btn active" style="background-color: #000000;" data-color="#000000"></button>
        <button class="color-btn" style="background-color: #ff3b30;" data-color="#ff3b30"></button>
        <button class="color-btn" style="background-color: #007aff;" data-color="#007aff"></button>

        <!-- Custom Color Picker -->
        <div class="color-picker-wrapper">
          <input type="color" id="customColor" class="custom-color-input" value="#ff00ff">
        </div>

        <!-- Eraser -->
        <button class="color-btn eraser-btn" id="eraserBtn" title="지우개">🧽</button>
      </div>

      <div class="brush-tools">
        <button id="undoBtn" class="btn btn-secondary" style="padding: 8px;" title="실행 취소">↩️</button>
        <button id="redoBtn" class="btn btn-secondary" style="padding: 8px;" title="다시 실행">↪️</button>
        <button id="clearBtn" class="btn btn-secondary" style="padding: 8px;">🗑️ 지우기</button>
        <button id="nextBtn" class="btn btn-primary">➡️ 뼈대 맞추기</button>
      </div>
    </footer>

    <!-- Joint Adjust Controls (Hidden initially) -->
    <footer class="controls hidden" id="jointControls">
      <div style="width: 100%; margin-bottom: 12px;">
        <label for="motionSelect" style="font-size: 0.85rem; color: #555; font-weight: 600; display: block; margin-bottom: 6px;">🎬 어떤 모션으로 춤출까요?</label>
        <select id="motionSelect" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; font-size: 0.95rem; background: #fff; color: #333; outline: none; cursor: pointer;">
          <option value="random">🎲 아무거나 랜덤 (Random)</option>
          <option value="jumping">🏃‍♂️ 달리기 (Running Jump)</option>
          <option value="jumping_jacks">🤸 점핑잭 (Jumping Jacks)</option>
          <option value="dab">😎 댑 댄스 (Dab Dance)</option>
          <option value="jesse_dance">🕺 제시 댄스 (Jesse Dance)</option>
          <option value="wave_hello">👋 인사하기 (Wave Hello)</option>
          <option value="zombie">🧟 좀비 워킹 (Zombie Walk)</option>
        </select>
      </div>
      <div class="brush-tools" style="width: 100%; justify-content: space-between; align-items: center;">
        <button id="backBtn" class="btn btn-secondary" style="padding: 8px 12px; font-size: 0.9rem;">⬅️ 다시 그리기</button>
        <div style="font-size: 0.8rem; color: #777; text-align: center; line-height: 1.2;">점을 드래그하여<br>관절에 맞추세요</div>
        <button id="submitBtn" class="btn btn-primary" style="padding: 8px 12px; font-size: 0.9rem;">🚀 무대에 전송하기</button>
      </div>
    </footer>
  </div>

  <script src="/frontend/pad/js/silhouette.js?v=3"></script>
  <script src="/frontend/pad/js/canvas.js?v=5"></script>
  <script src="/frontend/pad/js/skeleton_ui.js?v=3"></script>
  <script src="/frontend/keepdraw/js/app.js?v=6"></script>
</body>

</html>
